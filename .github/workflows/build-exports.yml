name: build-exports

on:
  push:
    branches: [main]
    paths:
      - "npcs/**"
      - "fragments/**"
      - "sections/**"
      - "schema/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Validate NPC canon
        run: python scripts/validate.py
      - name: Build exports and roster
        run: python scripts/build_exports.py
      - name: Commit regenerated files
        run: |
          git config user.name "hai-npc-canon bot"
          git config user.email "actions@users.noreply.github.com"
          git add exports ROSTER.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate exports and roster [skip ci]"
            git push
          fi
